<svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 880 470" class="v-l8" role="img" aria-label="Lazy eight: one complete maneuver drawn as the path the nose traces against the horizon, with the 45, 90, 135 and 180 degree reference points marked on each of the two turns">
  <g class="d">
  <defs><marker id="ah-l8" viewbox="0 0 8 8" refx="7.2" refy="4" markerwidth="5.5" markerheight="5.5" orient="auto-start-reverse"><path class="ahd" d="M0 0 L8 4 L0 8 Z"></path></marker></defs>

  <text class="ti" x="12" y="20">LAZY EIGHT — the path the nose traces against the horizon</text>
  <text class="tiny l" x="12" y="38">Nothing is ever constant: pitch and bank change continuously, and every rate is slow and symmetrical. Entry at the POH figure, or no more than V<tspan class="sub">A</tspan>.</text>

  <line class="horiz" x1="40" y1="196" x2="840" y2="196"></line>
  <text class="tiny r" x="836" y="190">HORIZON</text>

  <!-- one complete lazy eight: two 180 degree turns in opposite directions -->
  <path class="eight" d="M80 196 C140 86 260 86 320 196 C380 306 500 306 560 196"></path>
  <path class="ar" d="M560 196 H586"></path>
  <text class="tiny l" x="596" y="216">and on into the next one</text>

  <!-- first turn: climbing, turning one way -->
  <circle class="pt" cx="80" cy="196" r="5"></circle>
  <text class="lb b" x="80" y="222">ENTRY</text>
  <text class="tiny" x="80" y="236">level, entry speed</text>

  <circle class="pt hi" cx="134" cy="134" r="5"></circle>
  <text class="lb b" x="134" y="124">45°</text>
  <text class="tiny" x="134" y="86">steepest pitch up,</text>
  <text class="tiny" x="134" y="100">bank still increasing</text>
  <line class="lead" x1="134" y1="106" x2="134" y2="128"></line>

  <circle class="pt hi" cx="200" cy="114" r="5"></circle>
  <text class="lb b" x="200" y="104">90°</text>
  <text class="tiny" x="200" y="62">maximum bank, lowest airspeed,</text>
  <text class="tiny" x="200" y="76">pitch back down through level</text>
  <line class="lead" x1="200" y1="82" x2="200" y2="108"></line>

  <circle class="pt hi" cx="266" cy="134" r="5"></circle>
  <text class="lb b" x="278" y="128">135°</text>
  <text class="tiny l" x="296" y="142">steepest pitch down</text>

  <circle class="pt" cx="320" cy="196" r="5"></circle>
  <text class="lb b" x="320" y="222">180°</text>
  <text class="tiny r" x="300" y="240">level again, at entry</text>
  <text class="tiny r" x="300" y="254">altitude and entry speed</text>
  <text class="tiny r" x="300" y="268">— then straight into the</text>
  <text class="tiny r" x="300" y="282">turn the other way</text>

  <!-- second turn: the mirror image -->
  <circle class="pt hi" cx="374" cy="258" r="5"></circle>
  <text class="lb b" x="374" y="250">45°</text>

  <circle class="pt hi" cx="440" cy="278" r="5"></circle>
  <text class="lb b" x="440" y="298">90°</text>
  <text class="tiny" x="440" y="312">maximum bank again,</text>
  <text class="tiny" x="440" y="326">lowest airspeed again</text>

  <circle class="pt hi" cx="506" cy="258" r="5"></circle>
  <text class="lb b" x="524" y="276">135°</text>

  <circle class="pt" cx="560" cy="196" r="5"></circle>
  <text class="lb b" x="560" y="172">360°</text>
  <text class="tiny" x="560" y="158">one complete lazy eight</text>

  <text class="tiny l" x="640" y="240">The two loops must be</text>
  <text class="tiny l" x="640" y="254">the same size and the</text>
  <text class="tiny l" x="640" y="268">same shape. An examiner</text>
  <text class="tiny l" x="640" y="282">is watching for symmetry</text>
  <text class="tiny l" x="640" y="296">as much as for numbers.</text>

  <!-- what is true at each point -->
  <text class="lb b l" x="14" y="360">WHAT IS TRUE AT EACH REFERENCE POINT</text>
  <rect class="bx s" x="14" y="372" width="204" height="76" rx="5"></rect>
  <text class="lb b" x="116" y="390">45°</text>
  <text class="lb" x="116" y="408">maximum pitch attitude</text>
  <text class="lb" x="116" y="424">bank about 15°</text>
  <text class="lb" x="116" y="440">airspeed still changing</text>

  <rect class="bx s" x="232" y="372" width="204" height="76" rx="5"></rect>
  <text class="lb b" x="334" y="390">90°</text>
  <text class="lb" x="334" y="408">maximum bank, about 30°</text>
  <text class="lb" x="334" y="424">pitch level, lowest speed</text>
  <text class="lb" x="334" y="440">the apex of the arc</text>

  <rect class="bx s" x="450" y="372" width="204" height="76" rx="5"></rect>
  <text class="lb b" x="552" y="390">135°</text>
  <text class="lb" x="552" y="408">pitch at its lowest</text>
  <text class="lb" x="552" y="424">bank back to about 15°</text>
  <text class="lb" x="552" y="440">airspeed increasing</text>

  <rect class="bx s" x="668" y="372" width="190" height="76" rx="5"></rect>
  <text class="lb b" x="763" y="390">180°</text>
  <text class="lb" x="763" y="408">wings level</text>
  <text class="lb" x="763" y="424">entry altitude and speed</text>
  <text class="lb" x="763" y="440">straight into the next half</text>

  <text class="wl" x="14" y="466">Completion standards at each 180° point: altitude <tspan class="k">±100 ft</tspan>, airspeed <tspan class="k">±10 kt</tspan>, heading <tspan class="k">±10°</tspan>, and the loops symmetrical.</text>
  </g>
</svg>